plugins { id 'com.android.application' }
android {
    namespace 'ch.jarvis.companion'
    compileSdk 35
    defaultConfig {
        applicationId 'ch.jarvis.companion'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '0.4.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.alphacephei:vosk-android:0.3.75'; testImplementation 'junit:junit:4.13.2' }
