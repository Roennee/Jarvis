name: Jarvis Agenda and Pixel widget
on:
  push:
    branches: [feature/jarvis-0.4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'icalendar>=6,<8' 'recurring-ical-events>=3,<4'
      - run: python -m unittest discover -s tests -v
      - run: node --check app.js
      - run: node tests/test_capture.cjs
      - run: node tests/test_agenda.cjs
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_agenda.py
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-agenda-previews
          path: ui-checks/
          retention-days: 14
      - run: bash -n start.sh setup.sh update.sh install-service.sh model-update.sh setup-model.sh
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore permanent private signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.JARVIS_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.JARVIS_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'No installable APK will be published: run bash setup-android-signing.sh once on the laptop.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis.p12"
          echo "JARVIS_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/jarvis.p12" >> "$GITHUB_ENV"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
        working-directory: android
        env:
          JARVIS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_ANDROID_KEYSTORE_PASSWORD }}
      - name: Verify signed APK
        if: steps.signing.outputs.ready == 'true'
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: jarvis-android-agenda
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
