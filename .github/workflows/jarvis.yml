name: Jarvis checks and Android prototype
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'icalendar>=6,<8' 'recurring-ical-events>=3,<4'
      - run: python -m unittest discover -s tests -v
      - run: node --check app.js
      - run: bash -n start.sh setup.sh update.sh install-service.sh model-update.sh setup-model.sh
  speech:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: python -m pip install 'faster-whisper>=1.1,<2' 'av==16.1.0' 'piper-tts>=1.5,<2'
      - name: Download public base speech model
        run: |
          python - <<'PYTHON'
          from huggingface_hub import snapshot_download
          snapshot_download('Systran/faster-whisper-base', local_dir='models/whisper-base')
          PYTHON
      - run: python -m piper.download_voices de_DE-thorsten-medium --data-dir models/piper
      - run: python tests/speech_roundtrip.py
      - name: Offline German speech round-trip
        run: |
          espeak-ng -v de -s 145 -w /tmp/jarvis-test.wav 'Morgen kaufe ich Milch. Danach gehe ich zum Training.'
          HF_HUB_OFFLINE=1 python transcribe.py /tmp/jarvis-test.wav models/whisper-base > /tmp/transcript.json
          python - <<'PYTHON'
          import json
          text=json.load(open('/tmp/transcript.json'))['text']
          print(text)
          assert all(word in text.lower() for word in ('morgen','training')), 'Speech pipeline did not return recognizable German content'
          print('Smoke test only: synthetic speech is not an accuracy benchmark; transcript requires review.')
          PYTHON
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore permanent private signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.JARVIS_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.JARVIS_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'No installable APK will be published: run bash setup-android-signing.sh once on the laptop.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis.p12"
          echo "JARVIS_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/jarvis.p12" >> "$GITHUB_ENV"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
        working-directory: android
        env:
          JARVIS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_ANDROID_KEYSTORE_PASSWORD }}
      - name: Verify signed APK
        if: steps.signing.outputs.ready == 'true'
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: jarvis-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
