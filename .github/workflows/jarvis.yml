name: Jarvis checks and Android prototype
on:
  push:
    branches: [main, feature/jarvis-0.4]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'icalendar>=6,<8' 'recurring-ical-events>=3,<4'
      - run: python -m unittest discover -s tests -v
      - run: node --check app.js
      - run: bash -n start.sh setup.sh update.sh install-service.sh model-update.sh
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-recorder-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
